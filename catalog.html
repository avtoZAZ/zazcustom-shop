<body>

  <!-- Вставьте этот header во ВСЕ ваши HTML файлы -->
<header class="header">

            <a href="index.html" class="logo">ZAZcustom</a>
            <nav class="nav">
                <a href="index.html" class="nav-link">Головна</a>
                <a href="catalog.html" class="nav-link">Каталог</a>
                <a href="about.html" class="nav-link">Про нас</a>

            </nav>
            <!-- Ссылку на корзину мы пока не делаем, так как для нее нужен JavaScript -->

        </div>
    </div>
</header>

    <main>
        <div class="container">

            <div class="filter-bar">

<div class="product-card" data-id="p1" data-name="Футболка DNIPPROGES" data-price="990">
    <a href="product.html" class="product-card-link">
        <!-- НОВЫЙ БЛОК ДЛЯ ИЗОБРАЖЕНИЙ -->
        <div class="product-image-container">
            <!-- Основное фото (первое) -->
            <img src="/img/fut1-front.png" alt="Футболка DNIPPROGES - вид спереди" class="product-image product-image-primary">

        </div>
        
        <h3 class="product-title">Футболка DNIPPROGES</h3>
        <p class="product-price">990 грн</p>
