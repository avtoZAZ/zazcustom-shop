<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ваша Корзина - ZAZcustom</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body class="cart-page">

    <header class="header">
        <div class="container">
            <div class="header-inner">
                <a href="index.html" class="logo">ZAZcustom</a>
                <nav class="nav">
                    <a href="index.html" class="nav-link">Головна</a>
                    <a href="catalog.html" class="nav-link">Каталог</a>
                    <a href="about.html" class="nav-link">Про нас</a>
                    <a href="contacts.html" class="nav-link">Контакти</a>
                </nav>
                <a href="cart.html" id="cart-link" class="cart-link">Корзина (0)</a>
            </div>
        </div>
    </header>

    <main>
        <div class="container text-page-container">
            <h1 class="page-title">Ваша Корзина</h1>

            <!-- Этот блок будет заполняться с помощью JavaScript -->
            <div id="cart-items-container">
                <!-- Пример того, как будет выглядеть товар (этот блок будет создан JS) -->
                <!-- 
                <div class="cart-item">
                    <img src="https://via.placeholder.com/100x120" alt="Товар" class="cart-item-image">
                    <div class="cart-item-info">
                        <h3 class="cart-item-title">Название товара</h3>
                        <p class="cart-item-price">990 грн</p>
                    </div>
                    <div class="cart-item-quantity">
                        <button class="quantity-btn">-</button>
                        <span>1</span>
                        <button class="quantity-btn">+</button>
                    </div>
                    <button class="cart-item-remove">Видалити</button>
                </div> 
                -->
            </div>

            <!-- Итог и форма оформления заказа -->
            <div id="cart-summary" class="cart-summary-hidden">
                <h2 class="cart-total">Загальна сума: <span id="cart-total-price">0</span> грн</h2>
                
                <form id="order-form" class="order-form">
                    <h3>Оформлення замовлення</h3>
                    <div class="form-group">
                        <label for="customer-name">Ваше ПІБ</label>
                        <input type="text" id="customer-name" required>
                    </div>
                    <div class="form-group">
                        <label for="customer-phone">Номер телефону</label>
                        <input type="tel" id="customer-phone" required>
                    </div>
                    <div class="form-group">
                        <label for="customer-comment">Коментар до замовлення (необов'язково)</label>
                        <textarea id="customer-comment" rows="3"></textarea>
                    </div>
                    <button type="submit" class="btn">Відправити замовлення в Telegram</button>
                    <p id="order-status"></p>
                </form>
            </div>

            <!-- Сообщение для пустой корзины -->
            <div id="empty-cart-message" class="empty-cart-message-hidden">
                <p>Ваша корзина порожня.</p>
                <a href="catalog.html" class="btn">Перейти до каталогу</a>
            </div>

        </div>
    </main>
    
    <footer class="footer">
        <div class="container">
            <p>© 2025 ZAZcustom. Усі права захищені.</p>
        </div>
    </footer>

    <script src="script.js"></script> 
</body>
</html>
