<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Контакти - ZAZcustom</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>

<header class="header">
    <div class="container">
        <div class="header-inner">
            <a href="index.html" class="logo">ZAZcustom</a>
            <nav class="nav">
                <a href="index.html" class="nav-link">Головна</a>
                <a href="catalog.html" class="nav-link">Каталог</a>
                <a href="about.html" class="nav-link">Про нас</a>
                <a href="contacts.html" class="nav-link">Контакти</a>
            </nav>
            <a href="cart.html" id="cart-link" class="cart-link">Корзина (0)</a>
        </div>
    </div>
</header>
    <main>
        <div class="container text-page-container">
            <h1 class="page-title">Наші Контакти</h1>
            <div class="contact-grid">
                <div class="contact-details">
                    <h3>Залишайтеся на зв'язку</h3>
                    <p><strong>Адреса:</strong> м. Запоріжжя, пр. Соборний (тільки онлайн)</p>
                    <p><strong>Email:</strong> support@zazcustom.com</p>
                    <p><strong>Instagram:</strong> @zaz_custom</p>
                    <p><strong>Години роботи:</strong> Пн-Сб, 10:00 - 19:00</p>
                </div>
               <form class="contact-form" id="contact-form">
                    <h3>Напишіть нам</h3>
                    <div class="form-group">
                        <label for="name">Ваше ім'я</label>
                        <input type="text" id="name" name="name" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Ваш Email</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="message">Повідомлення</label>
                        <textarea id="message" name="message" rows="5" required></textarea>
                    </div>

                    <!-- БЛОК СТАТИЧЕСКОЙ КАПЧИ -->
                    <div class="form-group">
                        <label for="captcha" id="captcha-label">Перевірка: Скільки буде 5 + 3?</label>
                        <input type="text" id="captcha" name="captcha" required autocomplete="off">
                    </div>
                    
                    <button type="submit" class="btn" id="submit-btn">Відправити</button>
                    <p id="form-status"></p>
                </form>
            </div>
        </div>
    </main>
   <footer class="footer">
        <div class="container">
            <p>© 2025 ZAZcustom. Усі права захищені.</p>
        </div>
    </footer>
  <script src="script.js"></script> 
</body>
</html>
